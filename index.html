<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civida Help — chat prototype</title>
<style>
/* ============================================================
   Civida Help prototype — mobile-first chat widget.
   Palette sampled from civida.ca's compiled theme CSS
   (wp-content/themes/civida/dist/assets/css/app.css, 2026-07-20):
   purple #452283 · deep ink #231142 · coral #dc5339 · amber #ffaa2d.
   §9.4: swap these if the brand team supplies official tokens.
   Brand font is "Eagle" (licensed webfont, not embeddable in a
   single-file prototype) — system stacks stand in for it.
   ============================================================ */
:root {
  --purple: #452283;
  --purple-deep: #231142;
  --ink: #2b2440;
  --muted: #6b6478;
  --wash: #f4f2fb;
  --surface: #ffffff;
  --line: #e5def2;
  --line-strong: #d8cdee;
  --lav: #efeaf9;
  --coral-text: #a63d28;
  --coral-line: #ecd4cc;
  --coral-wash: #fbf1ee;
  --amber: #ffaa2d;
  --radius: 16px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: Charter, "Iowan Old Style", Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--wash);
}
.chat {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  margin: 0 auto;
  background: var(--wash);
}
@media (min-width: 560px) {
  body {
    padding: 32px 16px;
    background: radial-gradient(1200px 620px at 50% -12%, #ebe3fa, var(--wash));
  }
  .chat {
    height: calc(100dvh - 64px);
    max-height: 780px;
    max-width: 460px;
    border: 1px solid var(--line);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(69, 34, 131, 0.16);
  }
}

/* ---- header ---- */
.chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 12px 16px;
  background: var(--purple);
  color: #fff;
}
.brand { display: flex; align-items: center; gap: 8px; }
.brand-name {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 0.3px;
}
.brand-tag {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 3px 9px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.35);
}
.hdr-btn {
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 999px;
  padding: 8px 14px;
  min-height: 40px;
  cursor: pointer;
}
.hdr-btn:hover { background: rgba(255, 255, 255, 0.26); }
.chat-header .hdr-btn:focus-visible {
  outline: 3px solid var(--amber);
  outline-offset: 2px;
}

/* ---- transcript ---- */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 14px 8px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  /* no scroll-behavior:smooth — staggered appends must pin instantly */
}
.msg { display: flex; }
.msg-bot {
  justify-content: flex-start;
  position: relative;
  padding-left: 38px;
}
.msg-user { justify-content: flex-end; }

/* Signature: a small Civida-purple house (amber door) marks each bot turn.
   "Life starts with a home." Pure CSS — no image assets. */
.msg-bot.step-start::before {
  content: "";
  position: absolute;
  left: 0;
  top: 4px;
  width: 26px;
  height: 23px;
  background: var(--purple);
  clip-path: polygon(50% 0, 100% 40%, 100% 100%, 0 100%, 0 40%);
}
.msg-bot.step-start::after {
  content: "";
  position: absolute;
  left: 9.5px;
  top: 16px;
  width: 7px;
  height: 11px;
  background: var(--amber);
  border-radius: 3.5px 3.5px 0 0;
}

.bubble {
  max-width: 92%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  border-bottom-left-radius: 5px;
  padding: 11px 14px;
  animation: rise 0.22s ease-out;
}
.bubble-text {
  margin: 0;
  font-family: var(--serif);
  font-size: 16.5px;
  line-height: 1.5;
  white-space: pre-line;
}
.bubble-links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
.link-pill {
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  color: var(--purple-deep);
  background: var(--lav);
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  padding: 8px 14px;
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  text-decoration: none;
  cursor: pointer;
}
.link-pill:hover { background: #e5dcf6; }
a.link-pill[target="_blank"]::after { content: " ↗"; font-weight: 400; }
.chip {
  max-width: 85%;
  background: var(--purple);
  color: #fff;
  border-radius: var(--radius);
  border-bottom-right-radius: 5px;
  padding: 10px 14px;
  font-weight: 600;
  font-size: 15px;
  animation: rise 0.22s ease-out;
}

/* ---- quick replies ---- */
.options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 2px 0 10px 38px;
  outline: none;
}
.opt {
  font-family: var(--sans);
  font: inherit;
  text-align: left;
  background: var(--surface);
  border: 1.5px solid var(--line-strong);
  border-radius: 14px;
  padding: 12px 14px;
  min-height: 48px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: var(--ink);
  cursor: pointer;
  text-decoration: none;
  animation: rise 0.22s ease-out;
}
.opt:hover { background: var(--lav); border-color: var(--purple); }
.opt:active { background: #e5dcf6; }
.opt-label {
  font-size: 15.5px;
  font-weight: 600;
  color: var(--purple-deep);
}
.opt-sub {
  font-size: 13.5px;
  color: var(--muted);
}
.opt-card { padding: 13px 14px; }
.opt-escape { border-color: var(--coral-line); }
.opt-escape:hover { background: var(--coral-wash); border-color: var(--coral-text); }
.opt-escape .opt-label { color: var(--coral-text); }

/* ---- footer ---- */
.chat-footer {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: 1px solid var(--line);
}
.chat-footer .hdr-btn {
  color: var(--purple-deep);
  background: var(--lav);
  border-color: var(--line-strong);
}
.chat-footer .hdr-btn:hover { background: #e5dcf6; }
.chat-footer .hdr-btn:disabled {
  opacity: 0.45;
  cursor: default;
}
.chat-footer .hdr-btn:disabled:hover { background: var(--lav); }
.disclaimer {
  margin: 0;
  font-size: 11.5px;
  color: var(--muted);
}

button:focus-visible, a:focus-visible {
  outline: 3px solid var(--purple-deep);
  outline-offset: 2px;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .bubble, .chip, .opt { animation: none; }
}

/* ---- small phones (320px) ---- */
@media (max-width: 340px) {
  body { font-size: 15px; }
  .messages { padding: 12px 10px 6px; }
  .msg-bot { padding-left: 30px; }
  .options { padding-left: 30px; }
  .msg-bot.step-start::before { width: 22px; height: 20px; top: 5px; }
  .msg-bot.step-start::after { left: 8px; top: 16px; width: 6px; height: 9px; }
  .bubble { max-width: 96%; }
  .bubble-text { font-size: 15.5px; }
  .brand-name { font-size: 17px; }
  .disclaimer { font-size: 11px; }
}
</style>
</head>
<body>

  </header>
  <div id="messages" class="messages" role="log" aria-live="polite"></div>
  <footer class="chat-footer">
    <button type="button" id="btn-back" class="hdr-btn" disabled>‹ Back</button>
    <p class="disclaimer">Prototype — wording is draft, pending Customer Success review.</p>

/* ============================================================
   PURE LOGIC — no DOM in here (unit-tested via tests/core.test.mjs).
   renderStep(content, loc) -> { messages: [{text, links?}], options: [...] }

   loc variants:
     {view:"routing", restart?}                      first prompt / start over
     {view:"group", groupId}                         a group's question menu
     {view:"answer", groupId, questionId}            a question's answer
     {view:"followup", groupId, questionId, optionIndex}
     {view:"escape", groupId}                        "talk to a person"
     {view:"picker", groupId?}                       district picker
     {view:"district", districtId, groupId?}         one office's card

   option: {label, sublabel?, go?} navigates; {label, url} opens a link.
   ============================================================ */
var ESCAPE_LABEL = "Something else / talk to a person";

function findGroup(content, id) {
  return content.groups.find(function (g) { return g.id === id; });
}
function findQuestion(group, id) {
  return (group.questions || []).find(function (q) { return q.id === id; });
}
function contactLine(group) {
  return {
    text: "Still need help? You can always " + group.contactText + ".",
    links: group.contactLinks
  };
}
function askAnother(groupId) {
  return { label: "Ask another question", go: { view: "group", groupId: groupId } };
}

function renderStep(content, loc) {
  var group = loc.groupId ? findGroup(content, loc.groupId) : null;

  if (loc.view === "routing") {
    return {
      messages: [
        { text: loc.restart ? content.meta.restart : content.meta.greeting },
        { text: content.meta.routingPrompt }
      ],
      options: content.groups.map(function (g) {
        return { label: g.label, sublabel: g.sublabel, go: { view: "group", groupId: g.id } };
      })
    };
  }

  if (loc.view === "group") {
    if (!group.questions || !group.questions.length) {
      /* direct-answer group ("Not sure / something else") */
      return {
        messages: [
          { text: group.answer, links: group.links },
          contactLine(group)
        ],
        options: [{ label: "Pick a different option", go: { view: "routing", restart: true } }]
      };
    }
    return {
      messages: [{ text: "Here's what I can help with — pick a question:" }],
      options: group.questions.map(function (q) {
        return { label: q.label, go: { view: "answer", groupId: group.id, questionId: q.id } };
      }).concat([{ label: ESCAPE_LABEL, kind: "escape", go: { view: "escape", groupId: group.id } }])
    };
  }

  if (loc.view === "answer") {
    var q = findQuestion(group, loc.questionId);
    if (q.action === "district-picker") {
      return renderStep(content, { view: "picker", groupId: group.id });
    }
    if (q.followUp) {
      return {
        messages: [
          { text: q.answer, links: q.links },
          { text: q.followUp.prompt }
        ],
        options: q.followUp.options.map(function (o, i) {
          return { label: o.label, go: { view: "followup", groupId: group.id, questionId: q.id, optionIndex: i } };
        })
      };
    }
    return {
      messages: [{ text: q.answer, links: q.links }, contactLine(group)],
      options: [askAnother(group.id)]
    };
  }

  if (loc.view === "followup") {
    var fq = findQuestion(group, loc.questionId);
    var opt = fq.followUp.options[loc.optionIndex];
    return {
      messages: [{ text: opt.answer, links: opt.links }, contactLine(group)],
      options: [askAnother(group.id)]
    };
  }

  if (loc.view === "escape") {
    return {
      messages: [
        { text: "No problem — here's how to reach a person:" },
        { text: "You can " + group.contactText + ".", links: group.contactLinks }
      ],
      options: [askAnother(group.id)]
    };
  }

  if (loc.view === "picker") {
    return {
      messages: [{ text: "Which area is your building in? Each district lists a few example buildings:" }],
      options: content.districts.map(function (d) {
        return {
          label: d.closed ? d.office + " — now served by District " + d.servedBy : d.office,
          sublabel: d.buildings,
          go: { view: "district", districtId: d.id, groupId: loc.groupId }
        };
      }).concat([
        { label: "Not sure — see the full list on civida.ca", url: content.pages.districtOffices }
      ])
    };
  }

  if (loc.view === "district") {
    var d = content.districts.find(function (x) { return x.id === loc.districtId; });
    var messages = [];
    if (d.closed) {
      messages.push({
        text: d.office + " walk-in services are closed — you're now served by District " + d.servedBy + ":"
      });
      d = content.districts.find(function (x) { return x.id === d.servedBy; });
    }
    messages.push({
      text: d.office + " — " + d.location + ". " + content.districtHours,
      links: [
        { label: "Call " + d.phone, url: "tel:" + d.phone },
        { label: "District offices page (map + emails)", url: content.pages.districtOffices }
      ]
    });
    var options = [{ label: "Pick a different district", go: { view: "picker", groupId: loc.groupId } }];
    if (loc.groupId) options.push(askAnother(loc.groupId));
    return { messages: messages, options: options };
  }

  throw new Error("Unknown view: " + loc.view);
}
</script>
<script>
/* ============================================================
   DOM RENDERER — the only script that touches the page.
   Content and flow rules live in the core script above.
   ============================================================ */
(function () {
  var messagesEl = document.getElementById("messages");
  var backBtn = document.getElementById("btn-back");
  var restartBtn = document.getElementById("btn-restart");
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var history = [];          /* stack of locs; top = current step */
  var busy = false;          /* true while bubbles are animating in */
  var firstRender = true;

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function scrollToEnd() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function linkNode(link, groupId) {
    if (link.action === "district-picker") {
      var b = el("button", "link-pill", link.label);
      b.type = "button";
      b.addEventListener("click", function () {
        if (!busy) choose(link.label, { view: "picker", groupId: groupId });
      });
      return b;
    }
    var a = el("a", "link-pill", link.label);
    a.href = link.url;
    if (/^https?:/.test(link.url)) {
      a.target = "_blank";
      a.rel = "noopener";
    }
    return a;
  }

  function bubbleNode(msg, groupId, isStepStart) {
    var wrap = el("div", "msg msg-bot" + (isStepStart ? " step-start" : ""));
    var bubble = el("div", "bubble");
    bubble.appendChild(el("p", "bubble-text", msg.text));
    if (msg.links && msg.links.length) {
      var links = el("div", "bubble-links");
      msg.links.forEach(function (l) { links.appendChild(linkNode(l, groupId)); });
      bubble.appendChild(links);
    }
    wrap.appendChild(bubble);
    return wrap;
  }

  function chipNode(label) {
    var wrap = el("div", "msg msg-user");
    wrap.appendChild(el("div", "chip", label));
    return wrap;
  }

  function optionsNode(options, groupId) {
    var row = el("div", "options");
    row.tabIndex = -1;
    row.setAttribute("role", "group");
    row.setAttribute("aria-label", "Choose an option");
    options.forEach(function (o) {
      var node;
      if (o.url) {
        node = el("a", "opt", "");
        node.href = o.url;
        node.target = "_blank";
        node.rel = "noopener";
      } else {
        node = el("button", "opt", "");
        node.type = "button";
        node.addEventListener("click", function () {
          if (!busy) choose(o.label, o.go);
        });
      }
      if (o.kind === "escape") node.classList.add("opt-escape");
      if (o.sublabel) node.classList.add("opt-card");
      node.appendChild(el("span", "opt-label", o.label));
      if (o.sublabel) node.appendChild(el("span", "opt-sub", o.sublabel));
      row.appendChild(node);
    });
    return row;
  }

  function clearOptions() {
    var old = messagesEl.querySelector(".options");
    if (old) old.remove();
  }

  function renderLoc(loc) {
    var step = renderStep(CONTENT, loc);
    var delay = reduceMotion ? 0 : 220;
    busy = true;
    step.messages.forEach(function (m, i) {
      setTimeout(function () {
        messagesEl.appendChild(bubbleNode(m, loc.groupId, i === 0));
        scrollToEnd();
      }, delay * i);
    });
    setTimeout(function () {
      var row = optionsNode(step.options, loc.groupId);
      messagesEl.appendChild(row);
      scrollToEnd();
      if (!firstRender) row.focus({ preventScroll: true });
      firstRender = false;
      busy = false;
    }, delay * step.messages.length);
    backBtn.disabled = history.length <= 1;
  }

  function choose(label, loc) {
    clearOptions();
    messagesEl.appendChild(chipNode(label));
    scrollToEnd();
    history.push(loc);
    renderLoc(loc);
  }

  backBtn.addEventListener("click", function () {
    if (busy || history.length <= 1) return;
    history.pop();
    clearOptions();
    messagesEl.appendChild(chipNode("‹ Back"));
    renderLoc(history[history.length - 1]);
  });

  restartBtn.addEventListener("click", function () {
    if (busy) return;
    clearOptions();
    messagesEl.appendChild(chipNode("⟲ Start over"));
    history = [{ view: "routing", restart: true }];
    renderLoc(history[0]);
  });

  history.push({ view: "routing" });
  renderLoc(history[0]);
})();
</script>
</body>
</html>
